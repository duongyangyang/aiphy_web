# aiphys-web — triển khai VPS bằng Docker Compose
#
# Ba service:
#   app    — Node/Express: React build + API + proxy ML
#   ml     — Python FastAPI: inference Module 3 & 4 (chỉ trong mạng nội bộ)
#   caddy  — reverse proxy + tự động HTTPS
#
# Dữ liệu (SQLite + backup) nằm ở ./data trên máy chủ — sao lưu thư mục này là
# sao lưu toàn bộ dữ liệu nghiên cứu.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "8787"
      DB_PATH: /data/app.db
      ML_HOST: ml
      ML_PORT: "8788"
      APP_ORIGIN: ${APP_ORIGIN}
    volumes:
      - ./data:/data
    depends_on:
      - ml
    # Không publish cổng ra ngoài: chỉ Caddy truy cập được qua mạng nội bộ.
    expose:
      - "8787"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  ml:
    build:
      context: .
      dockerfile: Dockerfile.ml
    restart: unless-stopped
    environment:
      OMP_NUM_THREADS: "2"
    expose:
      - "8788"
    # PyTorch load 2 model vào RAM; giới hạn để một request lỗi không kéo sập máy.
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8788/api/ml/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
